apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tiny-cni
  namespace: kube-system
  labels:
    app: tiny-cni
spec:
  selector:
    matchLabels:
      app: tiny-cni
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: tiny-cni
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      # This ensure tiny-cni gets installed on every node, even those not being ready
      # because a CNI plugin has not been installed yet.
      tolerations:
        - operator: Exists
      initContainers:
        # Runs deploy.sh: copies the binary to /opt/cni/bin and the config to
        # /etc/cni/net.d, then exits.
        - name: install
          image: ghcr.io/corentin-dupaigne/tiny-cni:1.0.0
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-bin
              mountPath: /opt/cni/bin
            - name: cni-conf
              mountPath: /etc/cni/net.d
      containers:
        # main container exposes prometheus endpoint
        - name: agent
          image: ghcr.io/corentin-dupaigne/tiny-cni-agent:1.1.0
          ports:
            - name: metrics
              containerPort: 9102
          volumeMounts:
            - name: cni-conf
              mountPath: /etc/cni/net.d
              readOnly: true
            - name: ipam-state
              mountPath: /run/tinycni.json
              readOnly: true
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        # Must match ipam.storagePath in docker/config-default.json
        - name: ipam-state
          hostPath:
            path: /run/tinycni.json
            type: FileOrCreate
